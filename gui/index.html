<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H3 Studio</title>
<script>
  (function () {
    const t = localStorage.getItem("h3theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root {
    --bg: #F7F8F6; --ink: #1C2320; --muted: #5A6660; --accent: #0F7B5F;
    --card: #FFFFFF; --border: #D8DED9; --code-bg: #ECEFEA;
    --danger: #A33B2E; --ok: #0F7B5F;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121614; --ink: #E4EAE5; --muted: #93A099; --accent: #4FCB9B;
      --card: #171C19; --border: #2A322D; --code-bg: #1B211E;
      --danger: #E07A6B; --ok: #4FCB9B;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121614; --ink: #E4EAE5; --muted: #93A099; --accent: #4FCB9B;
    --card: #171C19; --border: #2A322D; --code-bg: #1B211E;
    --danger: #E07A6B; --ok: #4FCB9B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 14px; line-height: 1.45;
  }
  header {
    display: flex; align-items: center; gap: 0.8rem;
    padding: 1rem 1.4rem 0.6rem;
  }
  .hbtn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.3rem;
    height: 26px; padding: 0 0.6rem; box-sizing: border-box;
    border: 1px solid var(--border); border-radius: 6px;
    background: transparent; color: var(--muted);
    font: inherit; font-size: 0.75rem; line-height: 1;
    text-decoration: none; cursor: pointer;
  }
  .hbtn:hover { border-color: var(--accent); color: var(--accent); }
  .hbtn svg { width: 14px; height: 14px; display: block; }
  header h1 { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 1.15rem; margin: 0; }
  header .status { color: var(--muted); font-size: 0.85rem; }
  .layout { display: grid; grid-template-columns: minmax(330px, 420px) 1fr; gap: 1rem; padding: 0 1.4rem 2rem; }
  .layout > div { min-width: 0; }
  @media (max-width: 1080px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; }
  h2 { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 0.6rem; }
  textarea {
    width: 100%; min-height: 110px; resize: vertical;
    background: var(--code-bg); color: var(--ink);
    border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem;
    font: inherit;
  }
  .tabs { display: flex; gap: 0.4rem; margin: 0.8rem 0 0.6rem; }
  .tabs button {
    flex: 1; padding: 0.4rem 0.2rem; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--muted); font: inherit; font-size: 0.85rem;
  }
  .tabs button.active { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  .drop {
    border: 1.5px dashed var(--border); border-radius: 8px; padding: 0.7rem;
    text-align: center; color: var(--muted); font-size: 0.85rem; cursor: pointer; margin-bottom: 0.5rem;
  }
  .drop.drag { border-color: var(--accent); color: var(--accent); }
  .thumbs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.5rem; }
  .thumb { position: relative; width: 72px; }
  .thumb img { width: 72px; height: 72px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); display: block; }
  .thumb .tag { position: absolute; left: 3px; bottom: 3px; background: rgba(0,0,0,0.65); color: #fff; font-size: 0.62rem; padding: 0 4px; border-radius: 4px; }
  .thumb .x { position: absolute; right: -6px; top: -6px; width: 18px; height: 18px; border-radius: 50%; border: none; background: var(--danger); color: #fff; font-size: 0.7rem; line-height: 1; cursor: pointer; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem 0.7rem; margin-top: 0.7rem; }
  label.field { display: flex; flex-direction: column; gap: 0.2rem; font-size: 0.78rem; color: var(--muted); min-width: 0; }
  label.field select, label.field input[type=number] {
    background: var(--code-bg); color: var(--ink); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.35rem 0.4rem; font: inherit;
    width: 100%; min-width: 0; text-overflow: ellipsis;
  }
  .seedrow { display: flex; gap: 0.4rem; align-items: center; }
  .seedrow input { flex: 1; min-width: 0; width: 100%; }
  .seedrow button { border: 1px solid var(--border); background: transparent; color: var(--ink); border-radius: 6px; padding: 0.3rem 0.5rem; cursor: pointer; }
  .toggle { display: flex; align-items: center; gap: 0.5rem; font-size: 0.82rem; color: var(--muted); margin-top: 0.2rem; grid-column: span 2; }
  .go {
    width: 100%; margin-top: 0.9rem; padding: 0.65rem; border: none; border-radius: 8px;
    background: var(--accent); color: var(--bg); font: inherit; font-weight: 700; font-size: 0.95rem; cursor: pointer;
  }
  .go:disabled { opacity: 0.5; cursor: default; }
  .err { color: var(--danger); font-size: 0.82rem; margin-top: 0.5rem; white-space: pre-wrap; }
  .job { display: flex; flex-direction: column; gap: 0.35rem; padding: 0.6rem 0; border-bottom: 1px solid var(--border); }
  .job:last-child { border-bottom: none; }
  .job .row { display: flex; justify-content: space-between; align-items: center; gap: 0.6rem; }
  .job .p { flex: 1; min-width: 0; font-size: 0.83rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job .meta { color: var(--muted); font-size: 0.75rem; font-family: ui-monospace, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 6px; border-radius: 3px; background: var(--code-bg); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; }
  .cancel { border: 1px solid var(--border); background: transparent; color: var(--danger); border-radius: 6px; padding: 0.15rem 0.5rem; cursor: pointer; font-size: 0.75rem; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 0.9rem; margin-top: 0.8rem; }
  .cardv { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .cardv video { width: 100%; display: block; background: #000; aspect-ratio: auto; }
  .cardv .body { padding: 0.6rem 0.7rem 0.7rem; display: flex; flex-direction: column; gap: 0.45rem; }
  .cardv .prompt { font-size: 0.8rem; max-height: 3.4em; overflow: hidden; cursor: pointer; overflow-wrap: anywhere; }
  .cardv .prompt.open { max-height: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .chip { font-family: ui-monospace, Menlo, monospace; font-size: 0.66rem; background: var(--code-bg); color: var(--muted); border-radius: 5px; padding: 0.1rem 0.35rem; }
  .chip.fail { background: var(--danger); color: #fff; }
  .actions { display: flex; gap: 0.4rem; }
  .actions button {
    flex: 1; border: 1px solid var(--border); background: transparent; color: var(--ink);
    border-radius: 6px; padding: 0.28rem 0.2rem; cursor: pointer; font-size: 0.74rem;
  }
  .actions button:hover { border-color: var(--accent); color: var(--accent); }
  .empty { color: var(--muted); font-size: 0.85rem; padding: 0.4rem 0; }
  .vwrap { position: relative; }
  .expand {
    position: absolute; top: 6px; right: 6px; z-index: 2;
    border: none; border-radius: 6px; background: rgba(0,0,0,0.55); color: #fff;
    font-size: 0.85rem; padding: 0.15rem 0.45rem; cursor: pointer;
  }
  .expand:hover { background: rgba(0,0,0,0.8); }
  #lightbox {
    position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.88);
    display: flex; align-items: center; justify-content: center;
  }
  #lightbox[hidden] { display: none; }
  #lightbox video, #lightbox img { max-width: 94vw; max-height: 92vh; outline: none; display: block; }
  #lightbox video[hidden], #lightbox img[hidden] { display: none; }
  .thumb img, .inthumb img { cursor: zoom-in; }
  .inthumbs { display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .inthumb { position: relative; }
  .inthumb img { width: 44px; height: 44px; object-fit: cover; border-radius: 5px; border: 1px solid var(--border); display: block; }
  .inthumb .tag { position: absolute; left: 2px; bottom: 2px; background: rgba(0,0,0,0.65); color: #fff; font-size: 0.55rem; padding: 0 3px; border-radius: 3px; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
</style>
</head>
<body>
<header>
  <h1>H3 Studio</h1>
  <span class="status" id="status">idle</span>
  <button id="theme" class="hbtn" aria-label="Theme" style="margin-left:auto;width:32px;padding:0"></button>
  <a href="/benchmarks" target="_blank" class="hbtn">Benchmarks</a>
  <button id="quit" class="hbtn" title="Stop the H3 Studio server">Quit server</button>
</header>
<div id="lightbox" hidden><video id="lbvid" controls autoplay></video><img id="lbimg" hidden alt=""></div>
<div class="layout">
  <div>
    <div class="panel">
      <h2>Generate</h2>
      <textarea id="prompt" placeholder="Describe the shot: subject, camera, light, motion — and the soundtrack (H3 generates audio from the same prompt)."></textarea>
      <div class="tabs" id="tabs">
        <button data-mode="text" class="active">Text</button>
        <button data-mode="firstlast">First / Last</button>
        <button data-mode="refs">References</button>
      </div>
      <div id="cond-firstlast" style="display:none">
        <div class="thumbs" id="fl-thumbs"></div>
        <div class="drop" id="drop-first">first frame — drop or click</div>
        <div class="drop" id="drop-last">last frame (optional) — drop or click</div>
      </div>
      <div id="cond-refs" style="display:none">
        <div class="thumbs" id="ref-thumbs"></div>
        <div class="drop" id="drop-ref">add reference image (up to 9) — drop or click<br><span style="font-size:0.72rem">address them in the prompt as “Picture 1”, “Picture 2”, …</span></div>
      </div>
      <div class="grid">
        <label class="field">size
          <select id="size">
            <optgroup label="Vertical">
              <option value="512x640">512 × 640 · 4:5 · 0.33 MP</option>
              <option value="480x736" selected>480 × 736 · ≈2:3 · 0.35 MP</option>
              <option value="576x1024">576 × 1024 · 9:16 · 0.59 MP</option>
              <option value="640x960">640 × 960 · 2:3 · 0.61 MP</option>
              <option value="768x960">768 × 960 · 4:5 · 0.74 MP</option>
              <option value="768x1152">768 × 1152 · 2:3 · 0.88 MP</option>
              <option value="736x1280">736 × 1280 · 9:16 720p · 0.94 MP</option>
            </optgroup>
            <optgroup label="Horizontal">
              <option value="864x480">864 × 480 · ≈16:9 · 0.41 MP</option>
              <option value="768x576">768 × 576 · 4:3 · 0.44 MP</option>
              <option value="1024x576">1024 × 576 · 16:9 · 0.59 MP</option>
              <option value="1152x576">1152 × 576 · 2:1 · 0.66 MP</option>
              <option value="1280x544">1280 × 544 · 21:9 · 0.70 MP</option>
              <option value="1024x768">1024 × 768 · 4:3 · 0.79 MP</option>
              <option value="1280x736">1280 × 736 · ≈16:9 720p · 0.94 MP</option>
            </optgroup>
            <optgroup label="Square">
              <option value="640x640">640 × 640 · 1:1 · 0.41 MP</option>
              <option value="768x768">768 × 768 · 1:1 · 0.59 MP</option>
            </optgroup>
            <option value="custom">custom…</option>
          </select>
        </label>
        <label class="field">duration
          <select id="frames">
            <option value="22">0.9 s (22 f)</option>
            <option value="56">2.3 s (56 f)</option>
            <option value="90">3.7 s (90 f)</option>
            <option value="124" selected>5.2 s (124 f)</option>
            <option value="192">8.0 s (192 f)</option>
            <option value="260">10.8 s (260 f)</option>
            <option value="345">14.4 s (345 f)</option>
          </select>
        </label>
        <label class="field" id="cw" style="display:none">width
          <input type="number" id="width" value="480" min="256" max="1536" step="32">
        </label>
        <label class="field" id="ch" style="display:none">height
          <input type="number" id="height" value="736" min="256" max="1536" step="32">
        </label>
        <label class="field">steps
          <select id="steps">
            <option value="4">4 · draft</option>
            <option value="6">6 · draft+</option>
            <option value="8">8</option>
            <option value="20" selected>20 · quality</option>
          </select>
        </label>
        <label class="field">reuse
          <select id="reuse">
            <option value="1">1 · exact</option>
            <option value="2" selected>2 · fast</option>
            <option value="3">3 · aggressive</option>
          </select>
        </label>
        <label class="field">layers
          <select id="layers">
            <option value="50" selected>50 · exact</option>
            <option value="45">45 · fast</option>
            <option value="40">40 · aggressive</option>
          </select>
        </label>
        <label class="field">seed
          <div class="seedrow">
            <input type="number" id="seed" value="42" min="0">
            <button id="dice" title="randomize">🎲</button>
          </div>
        </label>
        <label class="toggle">
          <input type="checkbox" id="ssd" checked> SSD streaming — tiny memory footprint (recommended unless you have 48 GB+ RAM; resident mode is faster but maps the full ~37 GB model)
        </label>
        <label class="toggle">
          <input type="checkbox" id="randomseed"> new random seed for every run
        </label>
      </div>
      <button class="go" id="go">Generate</button>
      <div id="est" style="color:var(--muted);font-size:0.78rem;margin-top:0.45rem;text-align:center"></div>
      <div class="err" id="err"></div>
    </div>
  </div>
  <div>
    <div class="panel">
      <h2>Queue</h2>
      <div id="queue"><div class="empty">nothing running</div></div>
    </div>
    <div style="margin-top:1rem">
      <div style="display:flex;align-items:baseline;gap:0.8rem;padding-left:0.2rem">
        <h2 style="margin:0">History</h2>
        <button id="clearall" style="border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:0.72rem;text-decoration:underline">clear all</button>
      </div>
      <div class="gallery" id="gallery"></div>
    </div>
  </div>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
let mode = "text";
let firstFrame = null, lastFrame = null, refs = [];

function setMode(m) {
  mode = m;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.mode === m));
  $("cond-firstlast").style.display = m === "firstlast" ? "" : "none";
  $("cond-refs").style.display = m === "refs" ? "" : "none";
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => setMode(b.dataset.mode));

$("size").onchange = () => {
  const v = $("size").value;
  const custom = v === "custom";
  $("cw").style.display = custom ? "" : "none";
  $("ch").style.display = custom ? "" : "none";
  if (!custom) { const [w, h] = v.split("x"); $("width").value = w; $("height").value = h; }
};
$("dice").onclick = e => { e.preventDefault(); $("seed").value = Math.floor(Math.random() * 2 ** 32); };

async function upload(file) {
  const res = await fetch("/api/upload?name=" + encodeURIComponent(file.name), { method: "POST", body: file });
  const j = await res.json();
  if (!res.ok) throw new Error(j.error || "upload failed");
  return { name: j.name, url: "/inputs/" + encodeURIComponent(j.name) };
}
function pickImage(cb) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.onchange = () => inp.files[0] && cb(inp.files[0]);
  inp.click();
}
function wireDrop(el, cb) {
  el.onclick = () => pickImage(cb);
  el.ondragover = e => { e.preventDefault(); el.classList.add("drag"); };
  el.ondragleave = () => el.classList.remove("drag");
  el.ondrop = e => {
    e.preventDefault(); el.classList.remove("drag");
    const f = e.dataTransfer.files[0];
    if (f) cb(f);
  };
}
function renderFL() {
  const box = $("fl-thumbs"); box.innerHTML = "";
  [[firstFrame, "first", () => { firstFrame = null; renderFL(); }],
   [lastFrame, "last", () => { lastFrame = null; renderFL(); }]].forEach(([img, tag, rm]) => {
    if (!img) return;
    const d = document.createElement("div"); d.className = "thumb";
    d.innerHTML = `<img src="${img.url}"><span class="tag">${tag}</span>`;
    d.querySelector("img").onclick = () => openLightbox(img.url, true);
    const x = document.createElement("button"); x.className = "x"; x.textContent = "×"; x.onclick = rm;
    d.appendChild(x); box.appendChild(d);
  });
}
function renderRefs() {
  const box = $("ref-thumbs"); box.innerHTML = "";
  refs.forEach((img, i) => {
    const d = document.createElement("div"); d.className = "thumb";
    d.innerHTML = `<img src="${img.url}"><span class="tag">Picture ${i + 1}</span>`;
    d.querySelector("img").onclick = () => openLightbox(img.url, true);
    const x = document.createElement("button"); x.className = "x"; x.textContent = "×";
    x.onclick = () => { refs.splice(i, 1); renderRefs(); };
    d.appendChild(x); box.appendChild(d);
  });
}
wireDrop($("drop-first"), async f => { firstFrame = await upload(f); renderFL(); });
wireDrop($("drop-last"), async f => { lastFrame = await upload(f); renderFL(); });
wireDrop($("drop-ref"), async f => { if (refs.length < 9) { refs.push(await upload(f)); renderRefs(); } });

$("go").onclick = async () => {
  $("err").textContent = "";
  if ($("randomseed").checked) $("dice").click();
  const body = {
    prompt: $("prompt").value, mode,
    params: {
      width: +$("width").value, height: +$("height").value,
      frames: +$("frames").value, steps: +$("steps").value,
      reuse: +$("reuse").value, layers: +$("layers").value,
      seed: +$("seed").value, ssd_streaming: $("ssd").checked,
    },
    refs: refs.map(r => r.name),
    first_frame: firstFrame && firstFrame.name,
    last_frame: lastFrame && lastFrame.name,
  };
  const res = await fetch("/api/generate", { method: "POST", body: JSON.stringify(body) });
  const j = await res.json();
  if (!res.ok) { $("err").textContent = j.error || "failed"; return; }
};

function chip(t, cls) { return `<span class="chip ${cls || ""}">${t}</span>`; }
function esc(s) { return (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function jobRow(j, running) {
  const d = document.createElement("div"); d.className = "job"; d.dataset.job = j.id;
  d.innerHTML = `
    <div class="row">
      <span class="p">${esc(j.prompt)}</span>
      <button class="cancel">${running ? "cancel" : "remove"}</button>
    </div>
    <div class="meta" data-phase>${running ? "starting…" : "queued"} · ${j.params.width}×${j.params.height} · ${j.params.frames}f · ${j.params.steps}st r${j.params.reuse} · seed ${j.params.seed}</div>
    ${running ? '<div class="bar"><i data-bar></i></div>' : ""}`;
  d.querySelector(".cancel").onclick = async () => {
    const r = await (await fetch("/api/cancel", { method: "POST", body: JSON.stringify({ id: j.id }) })).json();
    if (r.result === "not-found") syncAll();  // stale row (e.g. server restarted) — resync truth
  };
  return d;
}
let CURJOB = null, PROG = null;
setInterval(() => {
  if (!CURJOB) return;
  const row = document.querySelector(`.job[data-job="${CURJOB.id}"]`);
  if (!row) return;
  const el = row.querySelector("[data-phase]");
  if (!el) return;
  let base, at, label;
  if (PROG && PROG.job === CURJOB.id) {
    base = PROG.elapsed; at = PROG.at;
    label = `${PROG.phase} ${PROG.done}/${PROG.total}`;
    const stale = (Date.now() - PROG.at) / 1000;
    if (stale > 45) label += " · step running";
  } else {
    base = 0; at = CURJOB.started || Date.now(); label = "starting…";
    at = CURJOB.started; base = 0;
  }
  const elapsed = PROG && PROG.job === CURJOB.id
    ? PROG.elapsed + (Date.now() - PROG.at) / 1000
    : (Date.now() - (CURJOB.started || Date.now())) / 1000;
  el.textContent = `${label} · ${fmtTime(Math.max(0, elapsed))}`;
}, 1000);

function renderQueue(state) {
  const q = $("queue"); q.innerHTML = "";
  CURJOB = state.current || null;
  if (PROG && (!CURJOB || PROG.job !== CURJOB.id)) PROG = null;
  if (state.current) q.appendChild(jobRow(state.current, true));
  (state.pending || []).forEach(j => q.appendChild(jobRow(j, false)));
  if (!state.current && !(state.pending || []).length)
    q.innerHTML = '<div class="empty">nothing running</div>';
  $("status").textContent = state.current ? "generating…" : "idle";
}
function card(e) {
  const d = document.createElement("div"); d.className = "cardv";
  const p = e.params || {};
  const chips = [
    e.mode, `${p.width}×${p.height}`, `${p.frames}f`,
    `${p.steps}st·r${p.reuse}·L${p.layers}`, `seed ${p.seed}`,

    e.elapsed_s ? `${Math.floor(e.elapsed_s / 60)}m${String(Math.round(e.elapsed_s % 60)).padStart(2, "0")}s` : "",
  ].filter(Boolean).map(t => chip(t)).join("");
  const vid = e.ok && e.file
    ? `<div class="vwrap"><video controls preload="metadata" src="/videos/${encodeURIComponent(e.file.split("/").pop())}"></video><button class="expand" title="Expand">⤢</button></div>`
    : "";
  const inputs = [];
  (e.refs || []).forEach((p, i) => inputs.push({ p, tag: `P${i + 1}` }));
  if (e.first_frame) inputs.push({ p: e.first_frame, tag: "first" });
  if (e.last_frame) inputs.push({ p: e.last_frame, tag: "last" });
  const inthumbs = inputs.length
    ? `<div class="inthumbs">${inputs.map(o => {
        const n = o.p.split("/").pop();
        return `<span class="inthumb"><img src="/inputs/${encodeURIComponent(n)}" data-full="/inputs/${encodeURIComponent(n)}"><span class="tag">${o.tag}</span></span>`;
      }).join("")}</div>`
    : "";
  d.innerHTML = `${vid}<div class="body">
      <div class="prompt" title="click to expand">${esc(e.prompt)}</div>
      ${inthumbs}
      <div class="chips">${e.ok ? "" : chip("failed: " + esc(e.error || ""), "fail")}${chips}</div>
      <div class="actions">
        <button data-a="rerun">Re-run</button>
        <button data-a="copy">Copy prompt</button>
        ${e.ok ? '<button data-a="reveal">Reveal</button>' : ""}
        <button data-a="del" title="Remove from history; video goes to the Trash">Delete</button>
      </div>
    </div>`;
  d.querySelector(".prompt").onclick = ev => ev.target.classList.toggle("open");
  d.querySelectorAll(".inthumb img").forEach(img => {
    img.onclick = () => openLightbox(img.dataset.full, true);
  });
  d.querySelector('[data-a="rerun"]').onclick = () => {
    $("prompt").value = e.prompt;
    ["width", "height", "steps", "reuse", "layers", "seed"].forEach(k => { if (p[k] != null) $(k).value = p[k]; });
    $("frames").value = [...$("frames").options].some(o => +o.value === p.frames) ? p.frames : $("frames").value;
    $("size").value = "custom"; $("size").onchange();
    $("width").value = p.width; $("height").value = p.height;
    $("ssd").checked = p.ssd_streaming !== false;
    refs = (e.refs || []).map(path => {
      const n = path.split("/").pop();
      return { name: n, url: "/inputs/" + encodeURIComponent(n) };
    });
    firstFrame = e.first_frame
      ? { name: e.first_frame.split("/").pop(), url: "/inputs/" + encodeURIComponent(e.first_frame.split("/").pop()) }
      : null;
    lastFrame = e.last_frame
      ? { name: e.last_frame.split("/").pop(), url: "/inputs/" + encodeURIComponent(e.last_frame.split("/").pop()) }
      : null;
    renderRefs(); renderFL();
    setMode(e.mode || "text");
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  d.querySelector('[data-a="copy"]').onclick = () => navigator.clipboard.writeText(e.prompt);
  const rv = d.querySelector('[data-a="reveal"]');
  if (rv) rv.onclick = () => fetch("/api/reveal", { method: "POST", body: JSON.stringify({ file: e.file }) });
  const ex = d.querySelector(".expand");
  if (ex) ex.onclick = () => openLightbox(d.querySelector("video").src);
  d.querySelector('[data-a="del"]').onclick = async () => {
    if (!confirm(e.ok ? "Remove this render from history and move its video to the Trash?" : "Remove this failed entry from history?")) return;
    await fetch("/api/delete", { method: "POST", body: JSON.stringify({ ts: [e.ts] }) });
    d.remove();
  };
  return d;
}
function addEntry(e, prepend) {
  const g = $("gallery");
  prepend ? g.prepend(card(e)) : g.appendChild(card(e));
}

function openLightbox(src, isImage) {
  const lb = $("lightbox"), v = $("lbvid"), im = $("lbimg");
  if (isImage) {
    v.pause(); v.removeAttribute("src"); v.hidden = true;
    im.src = src; im.hidden = false;
  } else {
    im.hidden = true; im.removeAttribute("src");
    v.hidden = false; v.src = src; v.play().catch(() => {});
  }
  lb.hidden = false;
}
function closeLightbox() {
  const lb = $("lightbox"), v = $("lbvid"), im = $("lbimg");
  v.pause(); v.removeAttribute("src"); v.load();
  im.removeAttribute("src");
  lb.hidden = true;
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });

let BENCH_ROWS = [];
function evalsOf(steps, reuse) { return reuse <= 1 ? steps : Math.max(2, Math.round((steps - 2) / reuse) + 2); }
function workOf(mp, frames, steps, reuse, layers) { return Math.pow(mp, 1.6) * frames * evalsOf(steps, reuse) * (layers / 50); }
function fmtTime(s) { return `${Math.floor(s / 60)}m${String(Math.round(s % 60)).padStart(2, "0")}s`; }
function estimate() {
  const el = $("est");
  const mp = (+$("width").value * +$("height").value) / 1e6;
  const W = workOf(mp, +$("frames").value, +$("steps").value, +$("reuse").value, +$("layers").value);
  const mem = $("ssd").checked ? "ssd-stream" : "resident";
  let rows = BENCH_ROWS.filter(r => r.memory === mem), note = "";
  if (rows.length < 2) { rows = BENCH_ROWS; note = " · low confidence"; }
  if (rows.length < 1) { el.textContent = "no timing data yet — estimates appear after a few renders"; return; }
  // Each past render predicts this one by power-law ratio scaling; nearby
  // workloads dominate the weighted average, so repeats of a known size
  // return that size's own measured time instead of a global fit.
  let sw = 0, sp = 0;
  for (const r of rows) {
    const Wi = workOf(r.mp, r.frames, r.steps, r.reuse, r.layers);
    if (!(Wi > 0)) continue;
    const wgt = 1 / Math.pow(0.08 + Math.abs(Math.log(W / Wi)), 2);
    sw += wgt; sp += wgt * r.secs * (W / Wi);
  }
  if (!sw) { el.textContent = "no timing data yet"; return; }
  const est = sp / sw;
  el.textContent = `estimated: ~${fmtTime(est)} (from ${rows.length} past renders${note})`;
}
async function loadBench() {
  try { BENCH_ROWS = await (await fetch("/api/bench")).json(); } catch (e) { BENCH_ROWS = []; }
  estimate();
}
["size", "width", "height", "frames", "steps", "reuse", "layers", "ssd"].forEach(id => {
  const el = $(id);
  el.addEventListener("change", () => setTimeout(estimate, 0));
  el.addEventListener("input", () => setTimeout(estimate, 0));
});

async function syncAll() {
  const s = await (await fetch("/api/state")).json();
  renderQueue(s.queue);
  $("gallery").innerHTML = "";
  (s.history || []).forEach(e => addEntry(e, false));
}
async function boot() {
  await syncAll();
  const es = new EventSource("/api/events");
  let firstOpen = true;
  es.onopen = () => {
    if (firstOpen) { firstOpen = false; return; }
    syncAll();  // reconnected after a server restart — refresh everything
  };
  es.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "queue") renderQueue(m);
    if (m.type === "progress") {
      PROG = { job: m.job, phase: m.phase, done: m.done, total: m.total, elapsed: m.elapsed, at: Date.now() };
      const row = document.querySelector(`.job[data-job="${m.job}"]`);
      if (row) {
        const el = row.querySelector("[data-phase]");
        if (el) el.textContent = `${m.phase} ${m.done}/${m.total} · ${fmtTime(m.elapsed)}`;
        const bar = row.querySelector("[data-bar]");
        if (bar) bar.style.width = (100 * m.done / Math.max(1, m.total)) + "%";
      }
    }
    if (m.type === "done") { addEntry(m.entry, true); loadBench(); }
  };
}
$("clearall").onclick = async () => {
  if (!confirm("Remove ALL history entries and move their videos to the Trash?")) return;
  await fetch("/api/delete", { method: "POST", body: JSON.stringify({ all: true }) });
  $("gallery").innerHTML = "";
};
$("quit").onclick = async () => {
  let res = await fetch("/api/shutdown", { method: "POST", body: "{}" });
  let j = await res.json();
  if (!j.ok && j.running) {
    if (!confirm("A render is in progress — quit anyway and cancel it?")) return;
    await fetch("/api/shutdown", { method: "POST", body: JSON.stringify({ force: true }) });
  }
  $("status").textContent = "server stopped — close this tab; double-click studio to restart";
};
const THEME_ICONS = {
  auto: '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.8 A6.2 6.2 0 0 1 8 14.2 Z" fill="currentColor"/></svg>',
  light: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3.2" fill="currentColor" stroke="none"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.4 1.4M11.55 11.55l1.4 1.4M12.95 3.05l-1.4 1.4M4.45 11.55l-1.4 1.4"/></svg>',
  dark: '<svg viewBox="0 0 16 16"><path d="M13.6 9.8 A6.3 6.3 0 1 1 6.2 2.4 A5.1 5.1 0 0 0 13.6 9.8 Z" fill="currentColor"/></svg>',
};
function applyTheme(v) {
  if (v === "auto") { delete document.documentElement.dataset.theme; localStorage.removeItem("h3theme"); }
  else { document.documentElement.dataset.theme = v; localStorage.setItem("h3theme", v); }
  $("theme").innerHTML = THEME_ICONS[v];
  $("theme").title = `Theme: ${v} — click to change`;
  $("theme").dataset.mode = v;
}
$("theme").onclick = () => {
  const order = ["auto", "light", "dark"];
  applyTheme(order[(order.indexOf($("theme").dataset.mode) + 1) % 3]);
};
applyTheme(localStorage.getItem("h3theme") || "auto");
$("lightbox").onclick = e => { if (e.target.id === "lightbox") closeLightbox(); };
boot();
loadBench();
</script>
</body>
